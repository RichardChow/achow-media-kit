# Reusable Shot-Level Micro Zones (场景微位点库 — 避免人物贴在扁平背景板前)
# Inspired by couple-photo-orchestrator's Micro Zone practice: assign distinct micro-zones across Shots 1-8.
micro_zones:
  - id: doorway-or-archway-frame
    zh: 门厅入口 / 拱廊尽头框景
    en: Doorway entrance or colonnade archway frame
  - id: staircase-turn-or-mid-steps
    zh: 旋转楼梯转角 / 石阶中段
    en: Staircase landing turn or mid-flight stone steps
  - id: sunlit-window-seat
    zh: 落地窗侧 / 临窗木座与白纱帘交界
    en: Floor-to-ceiling window edge or sheer curtain threshold
  - id: balustrade-or-terrace-corner
    zh: 雕花栏杆边 / 露台转角俯瞰点
    en: Carved stone balustrade or terrace corner overlook
  - id: shoreline-or-ridge-edge
    zh: 浅滩水线边缘 / 草甸山脊迎风坡面
    en: Shallow waterline edge or windswept alpine ridge crest
  - id: bistro-table-or-porch-bench
    zh: 花园茶桌旁 / 木屋廊台坐席
    en: Garden tea table or wooden cottage porch seating
  - id: parked-car-door-or-mirror
    zh: 静止车门侧 / 敞篷车内与后视镜前景
    en: Parked vintage car door or convertible interior mirror frame
  - id: translucent-veil-canopy
    zh: 飘扬头纱形成的柔光纱幔空间内
    en: Luminous sheltered micro-space beneath the floating translucent veil
