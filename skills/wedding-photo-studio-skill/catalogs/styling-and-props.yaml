# Pet Reference Lock (宠物参考照保护规范 — 用于有宠物家庭婚纱照或任意带宠拍摄)
pet_reference_lock:
  when_to_apply: 用户上传宠物参考图或选择 pet-family-wedding 风格包时启用
  prompt_zh: 严格保留上传宠物参考照中的真实品种、体型比例、毛色分布、花纹斑点与耳眼特征，绝不擅自更换品种或放大成失真体型；采用与宠物齐平的低机位与宠物安全无毒道具（避开百合等对猫狗有毒花材）
  prompt_en: strictly preserve exact pet breed, realistic body scale, coat color, markings, ear shape, and eyes from the uploaded pet reference photo; use low eye-level camera perspectives and pet-safe non-toxic floral props (never toxic lilies)
